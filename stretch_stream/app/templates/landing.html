<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StretchSense</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page landing-page">
  <main class="landing-shell" aria-labelledby="landing-title">
    <section class="landing-hero">
      <div class="brand-mark">SS</div>
      <h1 id="landing-title">StretchSense</h1>
      <p>Quick stretching guidance before and after your workout.</p>
    </section>

    <section class="landing-choice" aria-label="Choose session type">
      <h2>What are you doing today?</h2>

      <div class="landing-actions">
        <a class="mode-card before" href="/setup?mode=before">
          <span class="card-title">Before Workout</span>
          <span class="card-desc">Warm up your body before training.</span>
          <span class="card-meta">3 to 5 min routine</span>
        </a>
        <a class="mode-card after" href="/setup?mode=after">
          <span class="card-title">After Workout</span>
          <span class="card-desc">Cool down after your workout.</span>
          <span class="card-meta">3 to 8 min routine</span>
        </a>
      </div>
    </section>

    <footer class="landing-footer">Local gym station &middot; No account needed</footer>
  </main>
</body>
</html>
