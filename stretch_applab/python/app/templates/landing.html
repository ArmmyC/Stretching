<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StretchSense - Quick Stretching Guidance</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="kiosk landing-kiosk">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-name">Stretch<span class="dot">.</span>Sense</div>
      </div>
      <div class="top-meta">Local gym station</div>
    </header>

    <section class="hero" aria-labelledby="landing-title">
      <h1 id="landing-title">StretchSense</h1>
      <p class="sub">Quick stretching guidance before and after your workout.</p>

      <div class="question">What are you doing today?</div>

      <div class="choice-grid" aria-label="Choose session mode">
        <a class="choice-card before" href="/setup?mode=before" data-mode="before">
          <div class="icon">&uarr;</div>
          <h2>Before Workout</h2>
          <p>Warm up your body before training.</p>
          <div class="meta">3 to 5 min routine</div>
          <div class="arrow" aria-hidden="true">&rsaquo;</div>
        </a>
        <a class="choice-card after" href="/setup?mode=after" data-mode="after">
          <div class="icon">&darr;</div>
          <h2>After Workout</h2>
          <p>Cool down after your workout.</p>
          <div class="meta">3 to 8 min routine</div>
          <div class="arrow" aria-hidden="true">&rsaquo;</div>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
