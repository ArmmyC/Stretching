<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StretchSense Nano Signals</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --surface: #ffffff;
      --surface-2: #edf2f7;
      --text: #18212f;
      --muted: #637083;
      --border: #d8e0ea;
      --blue: #2563eb;
      --cyan: #0891b2;
      --green: #16a34a;
      --amber: #d97706;
      --red: #dc2626;
      --violet: #7c3aed;
      --shadow: 0 8px 24px rgba(30, 41, 59, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.45;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--border);
      background: rgba(246, 248, 251, 0.94);
      backdrop-filter: blur(14px);
    }

    .topbar {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      width: min(1280px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 14px 0;
    }

    h1 {
      margin: 0;
      font-size: 20px;
      line-height: 1.1;
      font-weight: 760;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    button,
    select {
      min-height: 34px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
      font: inherit;
      font-size: 13px;
      padding: 7px 11px;
    }

    button {
      cursor: pointer;
    }

    button.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: white;
      font-weight: 650;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.48;
    }

    main {
      width: min(1280px, calc(100vw - 32px));
      margin: 18px auto 32px;
    }

    .status-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat {
      min-height: 74px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 10px 12px;
      box-shadow: var(--shadow);
    }

    .stat .label {
      color: var(--muted);
      font-size: 12px;
    }

    .stat .value {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 760;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .strip {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      padding: 10px;
      box-shadow: var(--shadow);
    }

    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 9px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
      user-select: none;
    }

    .toggle input {
      margin: 0;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .chart-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .chart-head {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: baseline;
      gap: 10px;
      padding: 10px 12px 6px;
      border-bottom: 1px solid var(--border);
    }

    .chart-title {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      font-weight: 700;
    }

    .swatch {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .chart-value {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    canvas {
      display: block;
      width: 100%;
      height: 132px;
    }

    .log {
      height: 76px;
      overflow: auto;
      margin-top: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #101827;
      color: #d7e2f2;
      padding: 10px 12px;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      white-space: pre-wrap;
    }

    @media (max-width: 900px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .controls {
        justify-content: flex-start;
      }

      .status-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .chart-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .status-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <h1>StretchSense Nano Signals</h1>
        <div class="subtle" id="connectionText">Disconnected</div>
      </div>
      <div class="controls">
        <select id="baudSelect" aria-label="Baud rate">
          <option value="115200" selected>115200 baud</option>
          <option value="9600">9600 baud</option>
        </select>
        <button id="connectButton" class="primary">Connect Nano</button>
        <button id="fullJsonButton" disabled>Full Sensors</button>
        <button id="jsonButton" disabled>Compact JSON</button>
        <button id="calibrateButton" disabled>Calibrate</button>
        <button id="clearButton">Clear</button>
        <button id="exportButton">Export CSV</button>
      </div>
    </div>
  </header>

  <main>
    <section class="status-grid" aria-label="Current signal summary">
      <div class="stat">
        <div class="label">State</div>
        <div class="value" id="stateValue">-</div>
      </div>
      <div class="stat">
        <div class="label">Relative Pitch</div>
        <div class="value" id="relativePitchValue">-</div>
      </div>
      <div class="stat">
        <div class="label">Gyro Avg</div>
        <div class="value" id="gyroAvgValue">-</div>
      </div>
      <div class="stat">
        <div class="label">Mag Field</div>
        <div class="value" id="magValue">-</div>
      </div>
      <div class="stat">
        <div class="label">Proximity</div>
        <div class="value" id="proximityValue">-</div>
      </div>
      <div class="stat">
        <div class="label">Mic Level</div>
        <div class="value" id="micValue">-</div>
      </div>
      <div class="stat">
        <div class="label">Environment</div>
        <div class="value" id="environmentValue">-</div>
      </div>
      <div class="stat">
        <div class="label">Samples</div>
        <div class="value" id="sampleValue">0</div>
      </div>
    </section>

    <section class="strip" id="signalToggles" aria-label="Signal visibility"></section>
    <section class="chart-grid" id="chartGrid" aria-label="Live signal charts"></section>
    <section class="log" id="log" aria-label="Serial log"></section>
  </main>

  <script>
    const maxSamples = 800;
    const samples = [];
    let port = null;
    let reader = null;
    let writer = null;
    let readLoopActive = false;
    let renderPending = false;

    const signalDefs = [
      { key: "relative_pitch", label: "Relative pitch", unit: "deg", color: "#2563eb", main: true, threshold: "arm_threshold", negativeThreshold: true },
      { key: "pitch", label: "Pitch", unit: "deg", color: "#0891b2", main: true },
      { key: "roll", label: "Roll", unit: "deg", color: "#7c3aed", main: true },
      { key: "gyro_mag", label: "Gyro magnitude", unit: "deg/s", color: "#dc2626", main: true },
      { key: "gyro_avg", label: "Gyro average", unit: "deg/s", color: "#d97706", main: true, threshold: "stability_threshold" },
      { key: "stability_score", label: "Stability score", unit: "", color: "#16a34a", main: true, fixedMin: 0, fixedMax: 100 },
      { key: "mx", label: "Mag X", unit: "uT", color: "#1e40af", main: false },
      { key: "my", label: "Mag Y", unit: "uT", color: "#0f766e", main: false },
      { key: "mz", label: "Mag Z", unit: "uT", color: "#6d28d9", main: false },
      { key: "mag_mag", label: "Mag magnitude", unit: "uT", color: "#9333ea", main: true },
      { key: "heading_deg", label: "Mag heading", unit: "deg", color: "#4f46e5", main: true, fixedMin: 0, fixedMax: 360 },
      { key: "proximity", label: "Proximity", unit: "", color: "#0e7490", main: true, fixedMin: 0, fixedMax: 255 },
      { key: "ambient", label: "Ambient light", unit: "", color: "#ca8a04", main: true },
      { key: "red", label: "Color red", unit: "", color: "#dc2626", main: false },
      { key: "green", label: "Color green", unit: "", color: "#16a34a", main: false },
      { key: "blue", label: "Color blue", unit: "", color: "#2563eb", main: false },
      { key: "pressure_hpa", label: "Pressure", unit: "hPa", color: "#0369a1", main: true },
      { key: "temperature_c", label: "Temperature", unit: "C", color: "#c2410c", main: true },
      { key: "humidity", label: "Humidity", unit: "%", color: "#0284c7", main: true, fixedMin: 0, fixedMax: 100 },
      { key: "mic_level", label: "Mic level", unit: "%", color: "#be123c", main: true, fixedMin: 0, fixedMax: 100 },
      { key: "mic_rms", label: "Mic RMS", unit: "", color: "#e11d48", main: false },
      { key: "mic_peak", label: "Mic peak", unit: "", color: "#f43f5e", main: false },
      { key: "mic_dbfs", label: "Mic dBFS", unit: "dB", color: "#9f1239", main: true, fixedMin: -90, fixedMax: 0 },
      { key: "gesture_code", label: "Gesture code", unit: "", color: "#64748b", main: false, fixedMin: -1, fixedMax: 4 },
      { key: "mag_ok_num", label: "Mag OK", unit: "", color: "#4f46e5", main: false, fixedMin: 0, fixedMax: 100 },
      { key: "apds_ok_num", label: "APDS OK", unit: "", color: "#0e7490", main: false, fixedMin: 0, fixedMax: 100 },
      { key: "baro_ok_num", label: "Baro OK", unit: "", color: "#0369a1", main: false, fixedMin: 0, fixedMax: 100 },
      { key: "env_ok_num", label: "Env OK", unit: "", color: "#0284c7", main: false, fixedMin: 0, fixedMax: 100 },
      { key: "mic_ok_num", label: "Mic OK", unit: "", color: "#be123c", main: false, fixedMin: 0, fixedMax: 100 },
      { key: "arm_raised_num", label: "Arm raised", unit: "", color: "#0f766e", main: true, fixedMin: 0, fixedMax: 100 },
      { key: "stable_num", label: "Stable hold", unit: "", color: "#65a30d", main: true, fixedMin: 0, fixedMax: 100 },
      { key: "state_code", label: "State code", unit: "", color: "#475569", main: true, fixedMin: -1, fixedMax: 4 },
      { key: "ax", label: "Accel X", unit: "g", color: "#1d4ed8", main: false },
      { key: "ay", label: "Accel Y", unit: "g", color: "#0f766e", main: false },
      { key: "az", label: "Accel Z", unit: "g", color: "#9333ea", main: false },
      { key: "gx", label: "Gyro X", unit: "deg/s", color: "#b91c1c", main: false },
      { key: "gy", label: "Gyro Y", unit: "deg/s", color: "#c2410c", main: false },
      { key: "gz", label: "Gyro Z", unit: "deg/s", color: "#a16207", main: false }
    ];

    const els = {
      connectButton: document.getElementById("connectButton"),
      fullJsonButton: document.getElementById("fullJsonButton"),
      jsonButton: document.getElementById("jsonButton"),
      calibrateButton: document.getElementById("calibrateButton"),
      clearButton: document.getElementById("clearButton"),
      exportButton: document.getElementById("exportButton"),
      baudSelect: document.getElementById("baudSelect"),
      connectionText: document.getElementById("connectionText"),
      chartGrid: document.getElementById("chartGrid"),
      signalToggles: document.getElementById("signalToggles"),
      log: document.getElementById("log"),
      stateValue: document.getElementById("stateValue"),
      relativePitchValue: document.getElementById("relativePitchValue"),
      gyroAvgValue: document.getElementById("gyroAvgValue"),
      magValue: document.getElementById("magValue"),
      proximityValue: document.getElementById("proximityValue"),
      micValue: document.getElementById("micValue"),
      environmentValue: document.getElementById("environmentValue"),
      sampleValue: document.getElementById("sampleValue")
    };

    const visibleSignals = new Set(signalDefs.filter((signal) => signal.main).map((signal) => signal.key));
    const chartElements = new Map();

    function stateCodeFromName(name) {
      const map = {
        NANO_ERROR: -1,
        NANO_ARM_LOW: 0,
        NANO_ARM_RAISED: 1,
        NANO_HOLD_STABLE: 2,
        NANO_UNSTABLE: 3,
        NANO_CALIBRATING: 4
      };
      return Object.prototype.hasOwnProperty.call(map, name) ? map[name] : NaN;
    }

    function normalizeSample(input) {
      const sample = { ...input };
      sample.t_host = Date.now();
      sample.arm_raised_num = sample.arm_raised ? 100 : 0;
      sample.stable_num = sample.stable ? 100 : 0;
      sample.mag_ok_num = sample.mag_ok ? 100 : 0;
      sample.apds_ok_num = sample.apds_ok ? 100 : 0;
      sample.baro_ok_num = sample.baro_ok ? 100 : 0;
      sample.env_ok_num = sample.env_ok ? 100 : 0;
      sample.mic_ok_num = sample.mic_ok ? 100 : 0;
      if (typeof sample.state_code !== "number") {
        sample.state_code = stateCodeFromName(sample.state);
      }
      return sample;
    }

    function parsePlotterLine(line) {
      if (!line.includes(":")) return null;
      const sample = {};
      for (const token of line.trim().split(/\s+/)) {
        const [key, raw] = token.split(":");
        if (!key || raw === undefined) continue;
        const value = Number(raw);
        if (Number.isFinite(value)) sample[key] = value;
      }
      if (Object.keys(sample).length === 0) return null;
      sample.type = "nano_imu";
      sample.arm_raised = sample.arm_raised >= 50;
      sample.stable = sample.stable >= 50;
      if (Number.isFinite(sample.state_band)) sample.state_code = sample.state_band / 20;
      return sample;
    }

    function addLog(text) {
      const stamp = new Date().toLocaleTimeString();
      els.log.textContent = `[${stamp}] ${text}\n` + els.log.textContent;
      els.log.textContent = els.log.textContent.slice(0, 3000);
    }

    function addSample(sample) {
      samples.push(normalizeSample(sample));
      while (samples.length > maxSamples) samples.shift();
      requestRender();
    }

    function handleLine(line) {
      const trimmed = line.trim();
      if (!trimmed) return;
      if (trimmed.startsWith("#")) {
        addLog(trimmed);
        return;
      }

      try {
        if (trimmed.startsWith("{")) {
          const parsed = JSON.parse(trimmed);
          if (parsed.type === "nano_imu") addSample(parsed);
          return;
        }

        const plotterSample = parsePlotterLine(trimmed);
        if (plotterSample) addSample(plotterSample);
      } catch (error) {
        addLog(`Parse skipped: ${error.message}`);
      }
    }

    function buildToggles() {
      els.signalToggles.innerHTML = "";
      for (const signal of signalDefs) {
        const label = document.createElement("label");
        label.className = "toggle";
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = visibleSignals.has(signal.key);
        input.addEventListener("change", () => {
          if (input.checked) visibleSignals.add(signal.key);
          else visibleSignals.delete(signal.key);
          buildCharts();
          requestRender();
        });
        label.append(input, signal.label);
        els.signalToggles.append(label);
      }
    }

    function buildCharts() {
      els.chartGrid.innerHTML = "";
      chartElements.clear();

      for (const signal of signalDefs) {
        if (!visibleSignals.has(signal.key)) continue;

        const card = document.createElement("article");
        card.className = "chart-card";

        const head = document.createElement("div");
        head.className = "chart-head";

        const title = document.createElement("div");
        title.className = "chart-title";
        const swatch = document.createElement("span");
        swatch.className = "swatch";
        swatch.style.background = signal.color;
        const titleText = document.createElement("span");
        titleText.textContent = signal.label;
        title.append(swatch, titleText);

        const value = document.createElement("div");
        value.className = "chart-value";
        value.textContent = "-";

        const canvas = document.createElement("canvas");
        canvas.height = 132;

        head.append(title, value);
        card.append(head, canvas);
        els.chartGrid.append(card);
        chartElements.set(signal.key, { canvas, value });
      }
    }

    function resizeCanvas(canvas) {
      const rect = canvas.getBoundingClientRect();
      const scale = window.devicePixelRatio || 1;
      const width = Math.max(1, Math.round(rect.width * scale));
      const height = Math.max(1, Math.round(rect.height * scale));
      if (canvas.width !== width || canvas.height !== height) {
        canvas.width = width;
        canvas.height = height;
      }
      return { width, height, scale };
    }

    function numericValues(key) {
      return samples
        .map((sample) => Number(sample[key]))
        .filter((value) => Number.isFinite(value));
    }

    function formatValue(value, unit) {
      if (!Number.isFinite(value)) return "-";
      const digits = Math.abs(value) >= 100 ? 0 : 1;
      return `${value.toFixed(digits)}${unit ? ` ${unit}` : ""}`;
    }

    function drawChart(signal) {
      const element = chartElements.get(signal.key);
      if (!element) return;

      const { canvas, value } = element;
      const { width, height } = resizeCanvas(canvas);
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, width, height);

      const values = numericValues(signal.key);
      const latest = values.length ? values[values.length - 1] : NaN;
      value.textContent = formatValue(latest, signal.unit);

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, width, height);

      ctx.strokeStyle = "#e2e8f0";
      ctx.lineWidth = 1;
      for (let i = 1; i < 4; i++) {
        const y = (height / 4) * i;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      if (values.length < 2) return;

      let min = signal.fixedMin;
      let max = signal.fixedMax;
      if (min === undefined || max === undefined) {
        min = Math.min(...values);
        max = Math.max(...values);

        if (signal.threshold) {
          const thresholdValues = numericValues(signal.threshold).map(Math.abs);
          if (thresholdValues.length) {
            const threshold = thresholdValues[thresholdValues.length - 1];
            min = Math.min(min, signal.negativeThreshold ? -threshold : threshold);
            max = Math.max(max, threshold);
          }
        }

        if (Math.abs(max - min) < 0.001) {
          min -= 1;
          max += 1;
        }

        const pad = (max - min) * 0.12;
        min -= pad;
        max += pad;
      }

      const toY = (raw) => height - ((raw - min) / (max - min)) * height;
      const startIndex = Math.max(0, samples.length - maxSamples);
      const pointCount = samples.length - startIndex;
      const toX = (index) => pointCount <= 1 ? 0 : (index / (pointCount - 1)) * width;

      if (signal.threshold) {
        const latestSample = samples[samples.length - 1] || {};
        const threshold = Number(latestSample[signal.threshold]);
        if (Number.isFinite(threshold)) {
          ctx.strokeStyle = "#94a3b8";
          ctx.setLineDash([6, 5]);
          ctx.beginPath();
          ctx.moveTo(0, toY(threshold));
          ctx.lineTo(width, toY(threshold));
          ctx.stroke();
          if (signal.negativeThreshold) {
            ctx.beginPath();
            ctx.moveTo(0, toY(-threshold));
            ctx.lineTo(width, toY(-threshold));
            ctx.stroke();
          }
          ctx.setLineDash([]);
        }
      }

      ctx.strokeStyle = signal.color;
      ctx.lineWidth = 2.2 * (window.devicePixelRatio || 1);
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();

      let hasPoint = false;
      for (let i = startIndex; i < samples.length; i++) {
        const sample = samples[i];
        const raw = Number(sample[signal.key]);
        if (!Number.isFinite(raw)) continue;
        const x = toX(i - startIndex);
        const y = toY(raw);
        if (!hasPoint) {
          ctx.moveTo(x, y);
          hasPoint = true;
        } else {
          ctx.lineTo(x, y);
        }
      }
      if (hasPoint) ctx.stroke();
    }

    function render() {
      renderPending = false;
      const latest = samples[samples.length - 1];

      if (latest) {
        els.stateValue.textContent = latest.state || (Number.isFinite(latest.state_code) ? latest.state_code : "-");
        els.relativePitchValue.textContent = formatValue(Number(latest.relative_pitch), "deg");
        els.gyroAvgValue.textContent = formatValue(Number(latest.gyro_avg), "deg/s");
        els.magValue.textContent = formatValue(Number(latest.mag_mag), "uT");
        els.proximityValue.textContent = formatValue(Number(latest.proximity), "");
        els.micValue.textContent = formatValue(Number(latest.mic_level), "%");
        const temp = Number(latest.temperature_c);
        const humidity = Number(latest.humidity);
        els.environmentValue.textContent = Number.isFinite(temp) || Number.isFinite(humidity)
          ? `${Number.isFinite(temp) ? temp.toFixed(1) + " C" : "-"} / ${Number.isFinite(humidity) ? humidity.toFixed(0) + "%" : "-"}`
          : "-";
      }
      els.sampleValue.textContent = samples.length.toString();

      for (const signal of signalDefs) drawChart(signal);
    }

    function requestRender() {
      if (renderPending) return;
      renderPending = true;
      requestAnimationFrame(render);
    }

    async function sendCommand(command) {
      if (!writer) return;
      const encoded = new TextEncoder().encode(`${command}\n`);
      await writer.write(encoded);
      addLog(`> ${command}`);
    }

    async function connect() {
      if (!("serial" in navigator)) {
        addLog("Web Serial is unavailable. Use Chrome or Edge on localhost/file.");
        return;
      }

      port = await navigator.serial.requestPort();
      await port.open({ baudRate: Number(els.baudSelect.value) });
      writer = port.writable.getWriter();
      els.connectButton.textContent = "Disconnect";
      els.fullJsonButton.disabled = false;
      els.jsonButton.disabled = false;
      els.calibrateButton.disabled = false;
      els.connectionText.textContent = "Connected";
      readLoopActive = true;
      await sendCommand("OUTPUT_FULL_JSON");
      readLoop();
    }

    async function disconnect() {
      readLoopActive = false;
      try {
        if (reader) {
          await reader.cancel();
          reader.releaseLock();
        }
      } catch (error) {
        addLog(`Reader close: ${error.message}`);
      }
      try {
        if (writer) {
          writer.releaseLock();
          writer = null;
        }
        if (port) {
          await port.close();
        }
      } catch (error) {
        addLog(`Port close: ${error.message}`);
      }
      port = null;
      reader = null;
      els.connectButton.textContent = "Connect Nano";
      els.fullJsonButton.disabled = true;
      els.jsonButton.disabled = true;
      els.calibrateButton.disabled = true;
      els.connectionText.textContent = "Disconnected";
    }

    async function readLoop() {
      const decoder = new TextDecoder();
      let carry = "";
      try {
        while (port && port.readable && readLoopActive) {
          reader = port.readable.getReader();
          try {
            while (readLoopActive) {
              const { value, done } = await reader.read();
              if (done) break;
              carry += decoder.decode(value, { stream: true });
              const lines = carry.split(/\r?\n/);
              carry = lines.pop() || "";
              for (const line of lines) handleLine(line);
            }
          } finally {
            reader.releaseLock();
            reader = null;
          }
        }
      } catch (error) {
        addLog(`Read stopped: ${error.message}`);
      } finally {
        if (readLoopActive) await disconnect();
      }
    }

    function exportCsv() {
      if (!samples.length) return;
      const keys = ["t_host", "t", "state", ...signalDefs.map((signal) => signal.key)];
      const lines = [keys.join(",")];
      for (const sample of samples) {
        lines.push(keys.map((key) => {
          const value = sample[key];
          if (value === undefined || value === null) return "";
          return String(value).includes(",") ? `"${String(value).replaceAll('"', '""')}"` : String(value);
        }).join(","));
      }

      const blob = new Blob([lines.join("\n")], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = `stretchsense_nano_${new Date().toISOString().replace(/[:.]/g, "-")}.csv`;
      link.click();
      URL.revokeObjectURL(url);
    }

    els.connectButton.addEventListener("click", async () => {
      try {
        if (port) await disconnect();
        else await connect();
      } catch (error) {
        addLog(error.message);
      }
    });

    els.fullJsonButton.addEventListener("click", () => sendCommand("OUTPUT_FULL_JSON"));
    els.jsonButton.addEventListener("click", () => sendCommand("OUTPUT_JSON"));
    els.calibrateButton.addEventListener("click", () => sendCommand("CALIBRATE"));
    els.clearButton.addEventListener("click", () => {
      samples.length = 0;
      requestRender();
    });
    els.exportButton.addEventListener("click", exportCsv);
    window.addEventListener("resize", requestRender);

    buildToggles();
    buildCharts();
    render();
  </script>
</body>
</html>
